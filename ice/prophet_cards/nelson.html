<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Russell M. Nelson - Prophet Card</title>

  <style>
    body {
      background-color: #FFECD7;
      font-family: Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    main {
      background-color: #008DB1;
      border: 5px solid #004E63;
      border-radius: 15px;
      width: 350px;
      text-align: center;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    h1 {
      color: #FFFFFF;
      margin-bottom: 5px;
    }

    h2 a {
      color: #91E4FB;
      text-decoration: none;
    }

    h2 a:hover {
      text-decoration: underline;
    }

    img {
      width: 230px;
      border: 4px solid white;
      border-radius: 5px;
      margin: 15px 0;
    }

    ul {
      list-style-type: disc;
      color: #FFFFFF;
      text-align: left;
      display: inline-block;
      margin: 10px 0 15px 0;
      padding-left: 20px;
      line-height: 1.5;
    }

    li {
      margin-bottom: 5px;
    }

    .quote {
      color: #FFD783;
      font-family: "Brush Script MT", "Nanum Brush Script", cursive;
      font-size: 1.1em;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <main>
    <!-- Prophet Name -->
    <h1>Russell M. Nelson</h1>

    <!-- Prophet Subtitle -->
    <h2>
      <a href="https://www.churchofjesuschrist.org" target="_blank">
        17th President of the Church of Jesus Christ of Latter-day Saints
      </a>
    </h2>

    <!-- Prophet Image -->
    <img src="images/nelson.png" alt="Russell M. Nelson">

    <!-- Prophet Information -->
    <ul>
      <li><strong>Born:</strong> Sep 9, 1924</li>
      <li><strong>Apostle:</strong> Apr 7, 1984</li>
      <li><strong>Prophet:</strong> Jan 14, 2018</li>
    </ul>

    <!-- Prophet Quote -->
    <p class="quote">
      “I urge you to devote time each week—for the rest of your life—
      to increase your understanding of the Atonement of Jesus Christ.”
    </p>
  </main>
</body>
</html>
